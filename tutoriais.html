    <meta property="og:url" content="https://erickdevs.it/tutoriais.html">
    <meta property="og:title" content="Tutoriais do Erick Dev">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tutoriais do Erick Dev">

    <link rel="stylesheet" href="css/styles.css?v=2026-v2">
    <link rel="icon" href="img/erickport.png" type="image/png">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <canvas id="white-theme-canvas"></canvas>

    <!-- Topbar Flutuante -->
    <div id="topbar-placeholder"></div>

    <main class="container">
        <!-- Hero HUD -->
        <div class="hero-hud">
            <div class="hero-hud-status">
                <span class="status-dot"></span>
                <span>CENTRAL: <b>GUIAS PRÁTICOS & HOW-TOs</b></span>
            </div>
            <div class="hero-hud-time">
                <span>PASSOS VERIFICADOS</span>
            </div>
        </div>

        <h1>[ <span class="cyber-accent">TUTORIAIS</span> ]</h1>

        <div class="ascii">
            <pre>
   ///||| GUIAS DE INSTALAÇÃO, REDES E SERVIDORES |||///
            </pre>
        </div>

        <div class="section" id="tutorials-list"></div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Terminal Interativo Popup -->
    <div class="terminal-popup" id="terminal">
        <div class="terminal-header">
            <div class="terminal-window-controls">
                <span class="terminal-dot dot-red"></span>
                <span class="terminal-dot dot-yellow"></span>
                <span class="terminal-dot dot-green"></span>
            </div>
            <span class="terminal-title">erick@matrix: ~ (bash)</span>
            <span class="close-btn" id="close-terminal" title="Fechar">[X]</span>
        </div>
        <div class="terminal-body" id="terminal-output">
            <p class="cli-highlight">Terminal iniciado. Digite <b>help</b> para ver comandos disponíveis.</p>
        </div>
        <div class="terminal-chips">
            <button class="terminal-chip-btn" data-cmd="whoami">whoami</button>
            <button class="terminal-chip-btn" data-cmd="skills">skills</button>
            <button class="terminal-chip-btn" data-cmd="projects">projects</button>
            <button class="terminal-chip-btn" data-cmd="help">help</button>
        </div>
        <div class="terminal-input">
            <span>$</span>
            <input type="text" id="terminal-input" placeholder="Digite um comando..." autocomplete="off">
        </div>
    </div>

    <!-- Incluir Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="js/scripts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
